name: lint
on:
  push:
    tags:
      - v*
    branches-ignore:
      - master
      - main
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: "Golang"
        uses: "actions/setup-go@v5"
        with:
          go-version: "1.23"
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - name: "Modules"
        run: "go mod download"
      - name: "Lint"
        uses: golangci/golangci-lint-action@v3
        with:
          version: "latest"
          skip-pkg-cache: true
          skip-build-cache: true
          args: "-c ./.golangci.yml --timeout=10m --issues-exit-code=0 --max-issues-per-linter=0 --sort-results ./..."
